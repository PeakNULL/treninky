<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Tréninkový deník</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f6f3;--fg:#1d1d1b;--card:#fff;--mut:#777;--bd:#ddd;--x:#2e9e5b;--a:#d9534f;--n:#e8a21c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171716;--fg:#eee;--card:#242422;--mut:#999;--bd:#3a3a38}}
:root[data-theme=dark]{--bg:#171716;--fg:#eee;--card:#242422;--mut:#999;--bd:#3a3a38}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:560px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:8px}.nav .t{flex:1;text-align:center}.t b{font-size:19px;display:block}.t span{color:var(--mut);font-size:14px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}
.row .l{flex:1;font-weight:600}.seg{display:flex;gap:6px}.seg button{width:52px;height:44px;font-weight:700;font-size:18px;text-transform:uppercase}
.seg button.on[data-v=x]{background:var(--x);color:#fff;border-color:var(--x)}.seg button.on[data-v=a]{background:var(--a);color:#fff;border-color:var(--a)}.seg button.on[data-v=n]{background:var(--n);color:#fff;border-color:var(--n)}
.bulk{display:flex;gap:8px;margin-top:10px}.bulk button{flex:1;font-weight:700}
input[type=text]{width:100%;margin-top:6px;padding:10px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--fg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cal div{text-align:center;font-size:13px;padding:7px 0;border-radius:8px;border:1px solid transparent;cursor:pointer}
.cal .h{color:var(--mut);cursor:default}.cal .d{background:var(--bg)}.cal .s{border-color:var(--fg);font-weight:700}
.cal .full{background:var(--x);color:#fff}.cal .part{background:#9fd6b5;color:#000}.cal .sick{background:var(--n);color:#fff}.cal .off{opacity:.35;cursor:default}
.st{font-size:13px;color:var(--mut);margin-top:6px}.big{width:100%;margin-top:6px;background:var(--x);color:#fff;border-color:var(--x);font-weight:700}
</style></head><body>
<div class="card"><div class="nav"><button id="pv">‹</button><div class="t"><b id="dt"></b><span id="dn"></span></div><button id="nx">›</button></div>
<div class="bulk"><button id="today">Dnes</button><input type="date" id="pick" style="flex:1.4;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg)"></div></div>
<div class="card" id="rows"></div>
<div class="card"><div style="font-weight:600">Celý den najednou</div><div class="bulk"><button data-all="x">Vše X</button><button data-all="a">Vše A</button><button data-all="n">Vše N</button></div></div>
<div class="card"><div class="nav"><button id="mp">‹</button><div class="t"><b id="mt"></b></div><button id="mn">›</button></div><div class="cal" id="cal"></div>
<div class="st">Zelená = trénink, světle zelená = část disciplín, oranžová = nemoc.</div></div>
<div class="card"><button class="big" id="exp">Stáhnout Excel pro trenéra</button><button class="big" style="background:var(--card);color:var(--fg);border-color:var(--bd)" id="imp">Načíst data z Excelu (obnova / jiné zařízení)</button><input type="file" id="f" accept=".xlsx" hidden><div class="st" id="st"></div></div>

const KEYS=Object.keys(DAYS),FIRST=KEYS[0],LAST=KEYS[KEYS.length-1];
let edits={},cur=null,mon=null,mode='jen v tomto zařízení';
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const vals=k=>edits[k]||DAYS[k][1];
const MN=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
function clamp(k){return k<FIRST?FIRST:k>LAST?LAST:k}
function fmt(k){const[y,m,d]=k.split('-');return +d+'. '+ +m+'. '+y}
function render(){
 const v=vals(cur);$('dt').textContent=fmt(cur);$('dn').textContent=DAYS[cur][2];$('pick').value=cur;$('pick').min=FIRST;$('pick').max=LAST;
 $('rows').innerHTML=LABELS.map((l,i)=>`<div class="row"><div class="l">${l.replace(':','')}</div><div class="seg">${['x','a','n'].map(c=>`<button data-i="${i}" data-v="${c}" class="${v[i]===c?'on':''}">${c}</button>`).join('')}</div></div>`).join('')+
 `<input type="text" id="race" placeholder="Závody: číslo ČPM / název závodu" value="${['x','a','n',''].includes(v[7])?'':v[7].replace(/"/g,'&quot;')}">`;
 const[y,m]=mon;$('mt').textContent=MN[m]+' '+y;
 const first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 let h=['Po','Út','St','Čt','Pá','So','Ne'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(off);
 for(let d=1;d<=n;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');let c='d off';
  if(DAYS[k]){const w=vals(k);const nx=w.filter(z=>z==='x').length,nn=w.filter(z=>z==='n').length;c='d'+(nn>=4?' sick':nx>=1||w[7]&&!'xan'.includes(w[7])?(nx>=4?' full':' part'):'')}
  h+=`<div class="${c}${k===cur?' s':''}" data-k="${k}">${d}</div>`}
 $('cal').innerHTML=h;let bk='';try{const b=localStorage.getItem('td_bk');bk=b?' Poslední stažený Excel: '+fmt(iso(new Date(b)))+'.':' Excel jsi zatím nestáhl – stáhni ho aspoň 1× týdně jako zálohu.'}catch(e){}
 $('st').textContent='Uloženo '+mode+'.'+bk+' Tabulka pokrývá '+fmt(FIRST)+' – '+fmt(LAST)+'.';
}
function go(k){cur=clamp(k);mon=[+cur.slice(0,4),+cur.slice(5,7)-1];render()}
function shift(n){const d=new Date(cur+'T12:00:00');d.setDate(d.getDate()+n);go(iso(d))}
async function save(){
 try{localStorage.setItem('td_edits',JSON.stringify(edits))}catch(e){mode='NEULOŽENO – úložiště prohlížeče nefunguje, stáhni Excel'}
 render()}
function setDay(a){edits[cur]=a;save()}
$('rows').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=[...vals(cur)];a[+b.dataset.i]=b.dataset.v;setDay(a)};
$('rows').onchange=e=>{if(e.target.id!=='race')return;const a=[...vals(cur)];a[7]=e.target.value.trim()||'a';setDay(a)};
document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>setDay(Array(8).fill(b.dataset.all)));
$('pv').onclick=()=>shift(-1);$('nx').onclick=()=>shift(1);$('today').onclick=()=>go(iso(new Date()));
$('pick').onchange=e=>e.target.value&&go(e.target.value);
$('mp').onclick=()=>{mon=mon[1]?[mon[0],mon[1]-1]:[mon[0]-1,11];render()};$('mn').onclick=()=>{mon=mon[1]<11?[mon[0],mon[1]+1]:[mon[0]+1,0];render()};
$('cal').onclick=e=>{const k=e.target.dataset.k;if(k&&DAYS[k])go(k)};
async function exportXlsx(){
 const bin=Uint8Array.from(atob(XLSX_B64),c=>c.charCodeAt(0));const zip=await JSZip.loadAsync(bin);
 let ss=await zip.file('xl/sharedStrings.xml').async('string'),sx=await zip.file('xl/worksheets/sheet2.xml').async('string');
 const doc=new DOMParser().parseFromString(ss,'application/xml'),sis=[...doc.getElementsByTagName('si')],idx={};
 sis.forEach((s,i)=>{if(!(s.textContent in idx))idx[s.textContent]=i});let added='',cnt=sis.length;
 const sid=t=>{if(!(t in idx)){idx[t]=cnt++;added+='<si><t xml:space="preserve">'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</t></si>'}return idx[t]};
 const want={};for(const k in edits){const[r0,base]=DAYS[k];edits[k].forEach((v,i)=>{if(v!==base[i])want[r0+i]=v})}
 sx=sx.replace(/<c r="D(\d+)"([^>]*?)(?:\/>|>.*?<\/c>)/g,(m,r,at)=>{if(!(r in want))return m;const s=(at.match(/\ss="\d+"/)||[''])[0];const v=want[r];
  return v===''?`<c r="D${r}"${s}/>`:`<c r="D${r}"${s} t="s"><v>${sid(v)}</v></c>`});
 ss=ss.replace(/uniqueCount="\d+"/,`uniqueCount="${cnt}"`).replace('</sst>',added+'</sst>');
 zip.file('xl/sharedStrings.xml',ss);zip.file('xl/worksheets/sheet2.xml',sx);
 const out=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'});
 let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:'Treninky_Dupik.xlsx',data:out})}catch(e){if(e.code==='declined')return;$('st').textContent='Stažení se nepovedlo: '+(e.message||e.code);return}try{localStorage.setItem('td_bk',new Date().toISOString())}catch(e){}render();return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='Treninky_Dupik.xlsx';document.body.appendChild(a);a.click();a.remove();try{localStorage.setItem('td_bk',new Date().toISOString())}catch(e){}render()}
$('exp').onclick=exportXlsx;

$('imp').onclick=()=>$('f').click();
$('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{const z=await JSZip.loadAsync(await f.arrayBuffer());
  const ss=[...new DOMParser().parseFromString(await z.file('xl/sharedStrings.xml').async('string'),'application/xml').getElementsByTagName('si')].map(s=>s.textContent);
  const sx=await z.file('xl/worksheets/sheet2.xml').async('string'),cell={};
  for(const m of sx.matchAll(/<c r="D(\d+)"([^>]*?)(?:\/>|>(.*?)<\/c>)/g)){const v=(m[3]||'').match(/<v>(.*?)<\/v>/);cell[m[1]]=v?(/t="s"/.test(m[2])?ss[+v[1]]:v[1]):''}
  const ne={};let n=0;for(const k of KEYS){const[r0,base]=DAYS[k];const a=base.map((_,i)=>cell[r0+i]??'');if(a.some((v,i)=>v!==base[i])){ne[k]=a;n++}}
  edits=ne;await save();$('st').textContent='Načteno, změněných dnů: '+n+'.'}catch(x){$('st').textContent='Soubor se nepodařilo načíst.'}e.target.value=''};
try{edits=JSON.parse(localStorage.getItem('td_edits')||'{}')}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
go(iso(new Date()));
